name: linux/amd64

on:
  schedule:
    - cron: '0 8 * * THU'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CONTENT_SERVER: "content.lacledeslan.net"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify HTTP and HTTPS reachability
        id: check_server
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --connect-timeout 10 "http://${CONTENT_SERVER}" || echo "000")
          HTTPS_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --connect-timeout 10 "https://${CONTENT_SERVER}" || echo "000")

          echo "HTTP Status: $HTTP_STATUS"
          echo "HTTPS Status: $HTTPS_STATUS"

          FAILED=false
          DETAILS=""

          if [ "$HTTP_STATUS" -eq 000 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            FAILED=true
            DETAILS="${DETAILS}\n- HTTP check failed (Status: ${HTTP_STATUS})"
          fi

          if [ "$HTTPS_STATUS" -eq 000 ] || [ "$HTTPS_STATUS" -ge 400 ]; then
            FAILED=true
            DETAILS="${DETAILS}\n- HTTPS check failed (Status: ${HTTPS_STATUS})"
          fi

          if [ "$FAILED" = true ]; then
            echo "details=${DETAILS}" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Send Slack Alert on Failure
        if: failure() && steps.check_server.outcome == 'failure'
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"⚠️ *Preflight Check Failed for Workflow: ${GITHUB_WORKFLOW}*\n*Server:* \`${CONTENT_SERVER}\`\n*Run ID:* ${GITHUB_RUN_ID}\n*Details:*${{ steps.check_server.outputs.details }}\"
            }" \
            "${{ secrets.SLACK_CLOUDALERTS_WEBHOOK_URL }}"

  build-and-push:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Pull Latest Linux Base Image
        run: docker pull debian:bullseye-slim
      - name: Build Linux Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./linux.Dockerfile
          tags: |
            lacledeslan/gamesvr-cs2d:latest
            ghcr.io/lacledeslan/gamesvr-cs2d:latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.event.repository.updated_at }}
            BUILD_NODE=${{ runner.name }}
            GIT_REVISION=${{ github.sha }}
          no-cache: true
      - name: Test Linux Image
        run: docker run --rm lacledeslan/gamesvr-cs2d:latest /app/ll-tests/gamesvr-cs2d.sh
      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Push to Docker HUB
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push lacledeslan/gamesvr-cs2d:latest
      - name: Push to GitHub Packages
        if: ${{ github.event_name != 'pull_request' }}
        run: docker push ghcr.io/lacledeslan/gamesvr-cs2d:latest
